###############################################################################
# Wait Kubernetes Node Ready
###############################################################################


- name: Wait node registration

  command:

    cmd:

      kubectl
      --kubeconfig={{ join_admin_conf_path }}
      get node {{ ansible_hostname }}


  register: node_registration


  changed_when: false


  retries: "{{ join_ready_wait_retries }}"

  delay: "{{ join_ready_wait_delay }}"


  until:

    - node_registration.rc == 0



- name: Wait Ready condition

  command:

    cmd:

      kubectl
      --kubeconfig={{ join_admin_conf_path }}
      get node {{ ansible_hostname }}
      -o jsonpath={.status.conditions[?(@.type=="Ready")].status}


  register: node_ready


  changed_when: false


  retries: "{{ join_ready_wait_retries }}"

  delay: "{{ join_ready_wait_delay }}"


  until:

    - node_ready.stdout == "True"



- name: Show nodes

  command:

    cmd:

      kubectl
      --kubeconfig={{ join_admin_conf_path }}
      get nodes -o wide


  register: nodes


  changed_when: false



- debug:

    var: nodes.stdout_lines