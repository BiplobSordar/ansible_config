- name: Wait for Kubernetes API server
  ansible.builtin.command:
    cmd: >-
      kubectl
      --kubeconfig={{ admin_kubeconfig_path }}
      get
      --raw=/healthz
  register: api_health
  changed_when: false
  retries: 30
  delay: 5
  until: api_health.rc == 0

- name: Wait until bootstrap node is registered
  ansible.builtin.command:
    cmd: >-
      kubectl
      --kubeconfig={{ admin_kubeconfig_path }}
      get node {{ node_name | default(inventory_hostname) }}
  register: bootstrap_node
  changed_when: false
  retries: 30
  delay: 5
  until: bootstrap_node.rc == 0

- name: Show bootstrap node status
  ansible.builtin.command:
    cmd: >-
      kubectl
      --kubeconfig={{ admin_kubeconfig_path }}
      get node {{ node_name | default(inventory_hostname) }}
      -o wide
  register: bootstrap_node_status
  changed_when: false

- name: Display bootstrap node status
  ansible.builtin.debug:
    var: bootstrap_node_status.stdout_lines