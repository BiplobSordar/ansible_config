---
# roles/bootstrap_control_plane/tasks/fetch_artifacts.yml
#
# Pulls admin.conf and join-command artifacts back to the Ansible control
# node so join_control_plane / join_workers roles (running against different
# hosts) can consume them via ansible.builtin.copy or lookup('file', ...).

- name: Ensure local artifacts directory exists on the control node
  ansible.builtin.file:
    path: "{{ local_artifacts_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Fetch admin.conf to the control node
  ansible.builtin.fetch:
    src: "{{ bootstrap_admin_conf_path }}"
    dest: "{{ admin_kubeconfig_path }}"
    flat: true
    mode: "0600"

- name: Fetch worker join command to the control node
  ansible.builtin.fetch:
    src: /etc/kubernetes/worker-join-command.sh
    dest: "{{ worker_join_command_path }}"
    flat: true
    mode: "0700"

- name: Fetch control-plane join command to the control node
  ansible.builtin.fetch:
    src: /etc/kubernetes/control-plane-join-command.sh
    dest: "{{ control_plane_join_command_path }}"
    flat: true
    mode: "0700"

- name: Fetch certificate key to the control node
  ansible.builtin.fetch:
    src: /etc/kubernetes/certificate-key.txt
    dest: "{{ certificate_key_path }}"
    flat: true
    mode: "0600"

- name: Lock down local artifacts directory permissions
  ansible.builtin.file:
    path: "{{ local_artifacts_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
