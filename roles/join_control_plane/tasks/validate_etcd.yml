###############################################################################
# Validate Stacked etcd Membership
#
# kubeadm HA cluster uses stacked etcd:
#
# Control Plane 1
#        |
#        |
#        +---- etcd member
#
# Control Plane 2
#        |
#        |
#        +---- etcd member
#
# Control Plane 3
#        |
#        |
#        +---- etcd member
#
#
# This task verifies:
#
# 1. etcd pod is running
# 2. Current node exists in etcd membership
#
###############################################################################


###############################################################################
# Wait for local etcd pod
###############################################################################

- name: Wait for local etcd pod running

  ansible.builtin.command:

    cmd: >

      kubectl

      --kubeconfig={{ join_admin_conf_path }}

      -n kube-system

      get pod

      etcd-{{ ansible_hostname }}

      -o jsonpath='{.status.phase}'


  register: etcd_phase


  changed_when: false


  retries: "{{ join_etcd_wait_retries }}"

  delay: "{{ join_etcd_wait_delay }}"


  until:

    - etcd_phase.rc == 0

    - etcd_phase.stdout == "Running"



###############################################################################
# Get etcd members
###############################################################################

- name: Get etcd cluster members

  ansible.builtin.command:

    cmd: >

      kubectl

      --kubeconfig={{ join_admin_conf_path }}

      -n kube-system

      exec

      etcd-{{ ansible_hostname }}

      -c etcd

      --

      etcdctl

      --endpoints=https://127.0.0.1:2379

      --cacert=/etc/kubernetes/pki/etcd/ca.crt

      --cert=/etc/kubernetes/pki/etcd/server.crt

      --key=/etc/kubernetes/pki/etcd/server.key

      member list


  register: etcd_members


  changed_when: false



###############################################################################
# Validate current member
###############################################################################

- name: Verify current control-plane exists in etcd

  ansible.builtin.assert:

    that:

      - ansible_hostname in etcd_members.stdout


    fail_msg: >

      {{ ansible_hostname }} was not found in etcd membership.


    success_msg: >

      etcd membership verified for {{ ansible_hostname }}.