---
###############################################################################
# Configure kubectl
#
# After kubeadm init completes, Kubernetes creates admin.conf.
#
# This task:
#
# 1. Creates /root/.kube
# 2. Installs admin.conf as the default kubeconfig
# 3. Verifies kubectl can communicate with the cluster
#
# Safe to execute multiple times.
###############################################################################

################################################################################
# Ensure kubeconfig directory exists
################################################################################

- name: Ensure root kubeconfig directory exists
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    owner: root
    group: root
    mode: "0700"

################################################################################
# Install kubeconfig
################################################################################

- name: Install admin kubeconfig
  ansible.builtin.copy:
    src: "{{ bootstrap_admin_conf_path }}"
    dest: /root/.kube/config
    remote_src: true
    owner: root
    group: root
    mode: "0600"

################################################################################
# Verify kubectl installation
################################################################################

- name: Verify kubectl client
  ansible.builtin.command:
    cmd: kubectl version --client
  changed_when: false

################################################################################
# Verify cluster connectivity
################################################################################

- name: Verify kubectl cluster access
  ansible.builtin.command:
    cmd: kubectl --kubeconfig=/root/.kube/config cluster-info
  register: kubectl_cluster_info
  changed_when: false

################################################################################
# Report
################################################################################

- name: Report kubectl configuration
  ansible.builtin.debug:
    msg:
      - "kubectl configured successfully."
      - "{{ kubectl_cluster_info.stdout }}"