###############################################################################
# Join Additional Kubernetes Control Plane Node
#
# Responsibilities:
#
# 1. Check whether node already joined
# 2. Validate kubeadm installation
# 3. Load control-plane join command
#      - Local artifact first
#      - AWS SSM fallback
# 4. Execute kubeadm join --control-plane
# 5. Create join marker
# 6. Configure kubectl
# 7. Wait until node becomes Ready
# 8. Validate etcd membership
#
###############################################################################


###############################################################################
# Check Existing State
###############################################################################

- name: Check control-plane join marker
  ansible.builtin.stat:
    path: "{{ join_marker_path }}"
  register: join_marker


- name: Check admin.conf
  ansible.builtin.stat:
    path: "{{ join_admin_conf_path }}"
  register: admin_conf



- name: Determine control-plane joined state
  ansible.builtin.set_fact:

    node_already_joined: >-
      {{
        join_marker.stat.exists
        and
        admin_conf.stat.exists
      }}



###############################################################################
# Validate kubeadm
###############################################################################

- name: Check kubeadm installation
  ansible.builtin.command:

    cmd: kubeadm version

  changed_when: false



###############################################################################
# Get Local Join Artifact
###############################################################################

- name: Check local control-plane join command artifact

  ansible.builtin.stat:

    path: "{{ control_plane_join_command_path }}"

  delegate_to: localhost

  become: false

  register: local_join_command

  when: not node_already_joined



- name: Load control-plane join command from local artifact

  ansible.builtin.set_fact:

    control_plane_join_cmd: >-
      {{
        lookup(
          'file',
          control_plane_join_command_path
        ) | trim
      }}

  when:

    - not node_already_joined
    - local_join_command.stat.exists | default(false)



###############################################################################
# AWS SSM FALLBACK
###############################################################################

- name: Load control-plane join command from AWS SSM

  ansible.builtin.set_fact:

    control_plane_join_cmd: >-
      {{
        lookup(
          'amazon.aws.ssm_parameter',
          kubeadm_control_plane_join_parameter,
          region=aws_region
        ) | trim
      }}

  when:

    - not node_already_joined
    - join_use_ssm_fallback
    - not (local_join_command.stat.exists | default(false))



###############################################################################
# Validate Join Command
###############################################################################

- name: Validate control-plane join command

  ansible.builtin.assert:

    that:

      - control_plane_join_cmd is defined

      - control_plane_join_cmd | length > 0


    fail_msg:

      Control-plane join command was not found.



###############################################################################
# Join Kubernetes Control Plane
###############################################################################

- name: Join Kubernetes control-plane node

  ansible.builtin.shell:

    cmd: "{{ control_plane_join_cmd }}"

    executable: /bin/bash


  register: kubeadm_control_plane_join


  when:

    - not node_already_joined



###############################################################################
# Create Join Marker
###############################################################################

- name: Create control-plane join marker

  ansible.builtin.copy:

    dest: "{{ join_marker_path }}"

    content: |
      joined_at={{ ansible_date_time.iso8601 }}
      node={{ inventory_hostname }}

    owner: root

    group: root

    mode: "0600"


  when:

    - not node_already_joined
    - kubeadm_control_plane_join.rc == 0



###############################################################################
# Configure kubectl
###############################################################################

- name: Configure kubectl

  ansible.builtin.include_tasks:

    file: configure_kubectl.yml



###############################################################################
# Wait Node Ready
###############################################################################

- name: Wait for Kubernetes readiness

  ansible.builtin.include_tasks:

    file: wait_for_ready.yml



###############################################################################
# Validate etcd
###############################################################################

- name: Validate etcd membership

  ansible.builtin.include_tasks:

    file: validate_etcd.yml



###############################################################################
# Report
###############################################################################

- name: Control-plane join complete

  ansible.builtin.debug:

    msg:

      - "Control-plane node joined successfully"

      - "Node: {{ inventory_hostname }}"