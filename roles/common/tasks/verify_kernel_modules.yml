---
- name: Install kernel module utilities
  become: true
  ansible.builtin.apt:
    name:
      - kmod
    state: present
    update_cache: true


- name: Load required Kubernetes kernel modules
  become: true
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter


- name: Persist Kubernetes kernel modules
  become: true
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    content: |
      overlay
      br_netfilter
    owner: root
    group: root
    mode: "0644"


- name: Collect loaded kernel modules
  ansible.builtin.command:
    cmd: lsmod
  register: loaded_modules
  changed_when: false


- name: Verify required kernel modules loaded
  ansible.builtin.assert:
    that:
      - item in loaded_modules.stdout
    fail_msg: "Kernel module {{ item }} is missing."
  loop:
    - overlay
    - br_netfilter