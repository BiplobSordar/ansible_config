---
- name: Check kernel modules directory exists
  stat:
    path: "/lib/modules/{{ ansible_kernel }}"
  register: kernel_modules_dir


- name: Verify kernel modules directory exists
  assert:
    that:
      - kernel_modules_dir.stat.exists
    fail_msg: "Kernel modules directory missing for {{ ansible_kernel }}"


- name: Check linux-modules-extra package availability
  shell: |
    apt-cache show linux-modules-extra-{{ ansible_kernel }}
  register: kernel_extra_package
  failed_when: false
  changed_when: false


- name: Install kernel module utilities
  apt:
    name:
      - kmod
      - linux-modules-extra-{{ ansible_kernel }}
    state: present
    update_cache: yes
  when:
    - kernel_extra_package.rc == 0


- name: Persist Kubernetes kernel modules
  copy:
    dest: /etc/modules-load.d/kubernetes.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter


- name: Load Kubernetes kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter


- name: Collect loaded kernel modules
  shell: lsmod
  register: loaded_modules
  changed_when: false
  check_mode: no


- name: Verify required Kubernetes kernel modules loaded
  assert:
    that:
      - item in loaded_modules.stdout
    fail_msg: "Kernel module {{ item }} is missing."
  loop:
    - overlay
    - br_netfilter