monitoring_namespace: monitoring

monitoring_kubeconfig: /etc/kubernetes/admin.conf

prometheus_release_name: kube-prometheus-stack
prometheus_stack_chart_version: "77.12.0"

loki_release_name: loki
loki_chart_version: "6.38.0"

promtail_release_name: promtail
promtail_chart_version: "6.16.6"

monitoring_helm_repositories:
  prometheus:
    name: prometheus-community
    url: "https://prometheus-community.github.io/helm-charts"

  grafana:
    name: grafana
    url: "https://grafana.github.io/helm-charts"