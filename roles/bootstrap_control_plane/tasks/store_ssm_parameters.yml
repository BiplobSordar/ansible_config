---
###############################################################################
# Store Kubernetes Join Credentials in AWS SSM Parameter Store
#
# Terraform creates these parameters.
# Bootstrap updates their values after kubeadm init.
#
# Parameters
#
#   Worker Join Command
#   Control Plane Join Command
#
# These values are later consumed by:
#
#   • join_workers role
#   • join_control_plane role
#   • Jenkins
#   • Auto Scaling Groups
#
###############################################################################

################################################################################
# Validate Required Variables
################################################################################

- name: Verify required SSM parameter names exist
  ansible.builtin.assert:
    that:
      - kubeadm_worker_join_parameter is defined
      - kubeadm_control_plane_join_parameter is defined
      - aws_region is defined
    fail_msg: >
      Required SSM parameter names are missing.
      Ensure Terraform outputs are loaded into Ansible.

################################################################################
# Store Worker Join Command
################################################################################

- name: Store worker join command
  community.aws.ssm_parameter:
    name: "{{ kubeadm_worker_join_parameter }}"
    description: Kubernetes Worker Join Command
    string_type: SecureString
    value: "{{ fact_worker_join_command }}"
    overwrite_value: always
    region: "{{ aws_region }}"
    state: present

################################################################################
# Store Control Plane Join Command
################################################################################

- name: Store control-plane join command
  community.aws.ssm_parameter:
    name: "{{ kubeadm_control_plane_join_parameter }}"
    description: Kubernetes Control Plane Join Command
    string_type: SecureString
    value: "{{ fact_control_plane_join_command }}"
    overwrite_value: always
    region: "{{ aws_region }}"
    state: present

################################################################################
# Report
################################################################################

- name: Report SSM update
  ansible.builtin.debug:
    msg:
      - "Worker join command stored in AWS SSM."
      - "Control-plane join command stored in AWS SSM."