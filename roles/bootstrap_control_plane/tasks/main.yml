---
###############################################################################
# Bootstrap the First Kubernetes Control Plane
#
# This role MUST run only on the first control-plane node.
#
# Responsibilities
#
# 1. Verify this play targets exactly one host.
# 2. Determine whether the cluster is already bootstrapped.
# 3. Render the kubeadm configuration.
# 4. Execute kubeadm init (first run only).
# 5. Configure kubectl.
# 6. Wait for the Kubernetes API Server.
# 7. Generate fresh join credentials.
# 8. Store join credentials in AWS SSM Parameter Store.
# 9. Fetch cluster artifacts to the Ansible control node.
###############################################################################

################################################################################
# Safety Check
################################################################################

- name: Verify exactly one bootstrap node is targeted
  ansible.builtin.assert:
    that:
      - ansible_play_hosts | length == 1
    fail_msg: >
      bootstrap_control_plane must run against exactly one host.
      Verify playbooks/04-bootstrap-control-plane.yml.

################################################################################
# Determine Bootstrap State
################################################################################

- name: Check bootstrap marker
  ansible.builtin.stat:
    path: "{{ bootstrap_marker_path }}"
  register: bootstrap_marker

################################################################################
# Generate kubeadm configuration
################################################################################

- name: Render kubeadm init configuration
  ansible.builtin.template:
    src: kubeadm-init-config.yaml.j2
    dest: "{{ bootstrap_kubeadm_config_path }}"
    owner: root
    group: root
    mode: "0600"

################################################################################
# Initialize Cluster
################################################################################

- name: Initialize Kubernetes control plane
  ansible.builtin.command:

    cmd: >
      kubeadm init
      --config {{ bootstrap_kubeadm_config_path }}
      {{ '--upload-certs' if bootstrap_upload_certs else '' }}

  register: kubeadm_init_result

  when: not bootstrap_marker.stat.exists

  changed_when: true

################################################################################
# Bootstrap Marker
################################################################################

- name: Create bootstrap marker
  ansible.builtin.copy:
    dest: "{{ bootstrap_marker_path }}"
    content: |
      bootstrapped=true
    owner: root
    group: root
    mode: "0600"

  when: not bootstrap_marker.stat.exists

################################################################################
# Configure kubectl
################################################################################

- name: Configure kubectl
  ansible.builtin.include_tasks: configure_kubectl.yml

################################################################################
# Wait until API Server is healthy
################################################################################

- name: Wait for Kubernetes API
  ansible.builtin.include_tasks: wait_for_api.yml

################################################################################
# Generate Join Credentials
################################################################################

- name: Generate fresh join credentials
  ansible.builtin.include_tasks: generate_join_credentials.yml

################################################################################
# Save Join Credentials into AWS SSM
################################################################################

- name: Store join credentials in AWS SSM
  ansible.builtin.include_tasks: store_ssm_parameters.yml

################################################################################
# Fetch Cluster Artifacts
################################################################################

- name: Fetch cluster artifacts
  ansible.builtin.include_tasks: fetch_artifacts.yml