###############################################################################
# Worker Node Ready Validation
#
# Worker join flow:
#
# kubeadm join
#       |
#       v
# kubelet starts
#       |
#       v
# Node registers in Kubernetes
#       |
#       v
# Wait until Ready=True
#
###############################################################################


###############################################################################
# Wait Worker Ready
###############################################################################

- name: Wait until worker node becomes Ready

  ansible.builtin.command:

    cmd: >

      kubectl

      --kubeconfig={{ worker_admin_conf_path_on_control_plane }}

      get node {{ ansible_hostname }}

      -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'


  register: worker_node_ready


  changed_when: false


  delegate_to: "{{ groups['control_plane'][0] }}"


  retries: "{{ worker_ready_wait_retries }}"

  delay: "{{ worker_ready_wait_delay }}"


  until:

    - worker_node_ready.rc == 0

    - worker_node_ready.stdout == "True"



###############################################################################
# Display Cluster Nodes
###############################################################################

- name: Get Kubernetes cluster nodes

  ansible.builtin.command:

    cmd: >

      kubectl

      --kubeconfig={{ worker_admin_conf_path_on_control_plane }}

      get nodes -o wide


  register: worker_nodes


  changed_when: false


  delegate_to: "{{ groups['control_plane'][0] }}"



###############################################################################
# Report
###############################################################################

- name: Show Kubernetes nodes

  ansible.builtin.debug:

    var: worker_nodes.stdout_lines