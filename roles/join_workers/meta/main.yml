galaxy_info:
  role_name: join_workers
  author: Platform Engineering
  description: >
    Joins every worker node (including new Auto Scaling Group members) to
    the cluster using the worker join command generated by
    bootstrap_control_plane. Idempotent and safe to re-run on scale-out.
