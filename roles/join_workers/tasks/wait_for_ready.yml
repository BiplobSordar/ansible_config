###############################################################################
# Worker Ready Validation
###############################################################################


- name: Wait until worker becomes Ready


  command: >-

    kubectl

    --kubeconfig={{ worker_admin_conf_path_on_control_plane }}

    get node {{ ansible_hostname }}

    -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'



  register: worker_node_ready


  changed_when: false


  delegate_to: "{{ groups['control_plane'][0] }}"


  retries: "{{ worker_ready_wait_retries }}"


  delay: "{{ worker_ready_wait_delay }}"


  until:


    - worker_node_ready.stdout == "True"



- name: Display worker status


  command: >-

    kubectl

    --kubeconfig={{ worker_admin_conf_path_on_control_plane }}

    get nodes -o wide



  register: worker_nodes


  changed_when: false


  delegate_to: "{{ groups['control_plane'][0] }}"



- name: Show cluster nodes


  debug:


    var: worker_nodes.stdout_lines