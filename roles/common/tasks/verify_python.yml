---

- name: Install python pip package
  become: true

  ansible.builtin.apt:
    name:
      - python3-pip
    state: present
    update_cache: true


- name: Verify python version
  ansible.builtin.command:
    cmd: python3 --version

  register: python_version

  changed_when: false


- name: Assert Python version
  ansible.builtin.assert:

    that:
      - python_version.stdout is search("Python 3")

    fail_msg:
      - "Python verification failed"

    success_msg:
      - "Python version verified"



- name: Verify pip
  ansible.builtin.command:
    cmd: python3 -m pip --version

  register: pip_version

  changed_when: false


- name: Assert pip available
  ansible.builtin.assert:

    that:
      - pip_version.rc == 0

    fail_msg:
      - "pip is not installed"

    success_msg:
      - "pip verified"