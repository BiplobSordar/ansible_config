- name: Install monitoring Python dependencies
  ansible.builtin.apt:
    name:
      - python3-kubernetes
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add monitoring Helm repositories
  ansible.builtin.include_tasks:
    file: repositories.yml

- name: Create monitoring values
  ansible.builtin.include_tasks:
    file: values.yml

- name: Install monitoring charts
  ansible.builtin.include_tasks:
    file: charts.yml