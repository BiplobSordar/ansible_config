---
- name: Kubernetes required sysctl values
  set_fact:
    kubernetes_sysctl:
      - key: net.ipv4.ip_forward
        value: "1"

      - key: net.bridge.bridge-nf-call-iptables
        value: "1"

      - key: net.bridge.bridge-nf-call-ip6tables
        value: "1"


- name: Apply Kubernetes sysctl configuration
  copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.ipv4.ip_forward = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1


- name: Reload sysctl configuration
  command:
    cmd: sysctl --system
  changed_when: false


- name: Read sysctl values
  command:
    cmd: "sysctl -n {{ item.key }}"
  register: sysctl_values
  changed_when: false
  check_mode: no
  loop: "{{ kubernetes_sysctl }}"


- name: Verify sysctl configuration
  assert:
    that:
      - item.stdout | trim == item.item.value
    fail_msg: "{{ item.item.key }} expected {{ item.item.value }} got {{ item.stdout }}"
  loop: "{{ sysctl_values.results }}"