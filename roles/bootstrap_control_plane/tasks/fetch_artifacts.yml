---
###############################################################################
# Fetch Kubernetes Cluster Artifacts
#
# Pull cluster artifacts from the bootstrap control-plane node to the
# Ansible control node.
#
# These artifacts are later consumed by:
#
#   • join_control_plane
#   • join_workers
#   • kubectl administration
#
###############################################################################

################################################################################
# Ensure Local Artifact Directory Exists
################################################################################

- name: Ensure local artifacts directory exists
  ansible.builtin.file:
    path: "{{ local_artifacts_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

################################################################################
# Fetch admin.conf
################################################################################

- name: Fetch admin.conf
  ansible.builtin.fetch:
    src: "{{ bootstrap_admin_conf_path }}"
    dest: "{{ admin_kubeconfig_path }}"
    flat: true

################################################################################
# Fetch worker join command
################################################################################

- name: Fetch worker join command
  ansible.builtin.fetch:
    src: "{{ bootstrap_worker_join_command_path }}"
    dest: "{{ worker_join_command_path }}"
    flat: true

################################################################################
# Fetch control-plane join command
################################################################################

- name: Fetch control-plane join command
  ansible.builtin.fetch:
    src: "{{ bootstrap_control_plane_join_command_path }}"
    dest: "{{ control_plane_join_command_path }}"
    flat: true

################################################################################
# Fetch certificate key
################################################################################

- name: Fetch certificate key
  ansible.builtin.fetch:
    src: "{{ bootstrap_certificate_key_path }}"
    dest: "{{ certificate_key_path }}"
    flat: true

################################################################################
# Secure Local Artifact Directory
################################################################################

- name: Secure local artifacts directory
  ansible.builtin.file:
    path: "{{ local_artifacts_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

################################################################################
# Report
################################################################################

- name: Report fetched artifacts
  ansible.builtin.debug:
    msg:
      - "Artifacts downloaded successfully."
      - "admin.conf"
      - "worker-join-command.sh"
      - "control-plane-join-command.sh"
      - "certificate-key.txt"