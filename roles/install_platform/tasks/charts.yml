---
###############################################################################
# Deploy Kubernetes Platform Helm Charts
#
# Installed components:
#
#   1. Ingress NGINX
#   2. Metrics Server
#   3. cert-manager
#   4. AWS EBS CSI Driver
#   5. Cluster Autoscaler
#   6. Argo CD
#
###############################################################################


###############################################################################
# Ingress NGINX
###############################################################################

- name: Install Ingress NGINX

  kubernetes.core.helm:

    kubeconfig: "{{ platform_kubeconfig }}"

    name: "{{ helm_charts.ingress_nginx.release }}"

    chart_ref: "{{ helm_charts.ingress_nginx.chart }}"

    chart_version: "{{ helm_charts.ingress_nginx.version }}"

    release_namespace: "{{ helm_charts.ingress_nginx.namespace }}"

    create_namespace: true

    values_files:

      - "{{ platform_values_dir }}/ingress-nginx.yaml"

    wait: true

    atomic: true



