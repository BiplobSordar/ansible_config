###############################################################################
# Terraform Outputs
###############################################################################
# These values are generated by Terraform and exported to outputs.json.
# Ansible reads them to understand the infrastructure that already exists.
#
# Flow:
# Terraform
#    ↓
# outputs.json
#    ↓
# Ansible (group_vars/all.yml)
###############################################################################

###############################################################################
# AWS Configuration
###############################################################################

aws_region: "{{ terraform_outputs.aws_region.value }}"

project_name: "{{ terraform_outputs.project_name.value }}"

environment_name: "{{ terraform_outputs.environment.value }}"

###############################################################################
# Kubernetes Cluster Information
###############################################################################

cluster_name: "{{ terraform_outputs.cluster_name.value }}"

###############################################################################
# Kubernetes API Endpoint
###############################################################################
# Internal Network Load Balancer DNS name created by Terraform.
#
# Every Control Plane and Worker node joins the cluster through
# this endpoint instead of connecting directly to another node.
###############################################################################

# control_plane_endpoint: "{{ terraform_outputs.control_plane_endpoint.value }}"
control_plane_endpoint: "{{ hostvars[groups['bootstrap'][0]].ansible_host }}"

control_plane_endpoint_port: 6443

###############################################################################
# Cluster Networking
###############################################################################
# These CIDRs must match the values used during kubeadm init.
###############################################################################

pod_network_cidr: "{{ terraform_outputs.pod_network_cidr.value }}"

service_cidr: "{{ terraform_outputs.service_cidr.value }}"

###############################################################################
# AWS Systems Manager Parameter Store
###############################################################################
# Terraform creates these Parameter Store entries.
#
# During cluster bootstrap Ansible stores:
#
# - Worker Join Command
# - Control Plane Certificate Key
#
# so that other nodes can retrieve them securely.
###############################################################################

worker_join_parameter_name: "{{ terraform_outputs.kubeadm_worker_join_parameter.value }}"

certificate_key_parameter_name: "{{ terraform_outputs.kubeadm_certificate_key_parameter.value }}"

###############################################################################
# Kubernetes Cluster Configuration
###############################################################################
# Global Kubernetes configuration used throughout the project.
###############################################################################

###############################################################################
# Kubernetes Version
###############################################################################

kubernetes_version: "1.30.14"

###############################################################################
# Kubernetes Repository Series
###############################################################################
# Used when configuring the Kubernetes APT repository.
#
# Example:
# https://pkgs.k8s.io/core:/stable:/v1.30/
###############################################################################

kubernetes_apt_series: "1.30"

###############################################################################
# Golden AMI Validation
###############################################################################
# IMPORTANT
#
# These variables DO NOT install software.
#
# They define the expected software versions that every Kubernetes node
# must already contain before cluster bootstrap starts.
#
# If any validation fails, Ansible stops immediately.
###############################################################################

###############################################################################
# Operating System
###############################################################################

expected_os_family: "Ubuntu"

expected_os_version: "26.04"

###############################################################################
# Linux Kernel
###############################################################################

expected_kernel_version: "7.0"

###############################################################################
# Python
###############################################################################
# Required because Ansible modules execute using Python.
###############################################################################

expected_python_version: "3.14"

###############################################################################
# Kubernetes Components
###############################################################################

expected_kubernetes_version: "1.30.14"

expected_kubeadm_version: "1.30.14"

expected_kubelet_version: "1.30.14"

###############################################################################
# Container Runtime
###############################################################################

expected_containerd_version: "2.2.6"

expected_cri_tools_version: "1.30"

###############################################################################
# Required Linux Kernel Modules
###############################################################################
# These modules are mandatory for Kubernetes networking.
###############################################################################

required_kernel_modules:

  - overlay

  - br_netfilter

###############################################################################
# Required sysctl Configuration
###############################################################################
# These kernel parameters enable container networking.
###############################################################################

required_sysctl:

  net.ipv4.ip_forward: 1

  net.bridge.bridge-nf-call-iptables: 1

  net.bridge.bridge-nf-call-ip6tables: 1

###############################################################################
# Required System Packages
###############################################################################
# These packages are expected to exist in the Golden AMI.
###############################################################################

required_packages:

  - chrony

  - python3

  - python3-pip

  - curl

  - jq

  - socat

  - conntrack

  - ethtool

  - ebtables

  - unzip




  ###############################################################################
# Container Runtime Interface (CRI)
###############################################################################
# Kubernetes does not run containers directly.
#
# kubelet communicates with the Container Runtime (containerd)
# through the CRI socket defined below.
#
# crictl is the command-line tool used to troubleshoot
# the container runtime.
###############################################################################

###############################################################################
# Container Runtime Socket
###############################################################################

containerd_socket: "unix:///run/containerd/containerd.sock"

###############################################################################
# crictl Configuration
###############################################################################

crictl_config_file: "/etc/crictl.yaml"

###############################################################################
# Local Cluster Artifacts
###############################################################################
# These files are generated during cluster bootstrap.
#
# IMPORTANT
# They exist ONLY on the Ansible Controller (or Jenkins server).
#
# They are NOT copied permanently to Kubernetes nodes.
#
# Generated files:
#
# • admin.conf
# • Worker Join Command
# • Control Plane Join Command
# • Certificate Key
#
###############################################################################

###############################################################################
# Local Artifact Directory
###############################################################################

local_artifacts_dir: "{{ playbook_dir }}/../.cluster-artifacts/{{ cluster_name }}"

###############################################################################
# Kubernetes Admin Configuration
###############################################################################
# Copied from the first Control Plane after kubeadm init.
#
# Used later by:
#
# • kubectl
# • Helm
# • Ansible kubernetes.core modules
###############################################################################

admin_kubeconfig_path: "{{ local_artifacts_dir }}/admin.conf"

###############################################################################
# Worker Join Command
###############################################################################
# Generated by:
#
# kubeadm token create --print-join-command
#
# Saved locally for later use.
###############################################################################

worker_join_command_path: "{{ local_artifacts_dir }}/worker-join-command.sh"

###############################################################################
# Control Plane Join Command
###############################################################################
# Generated after:
#
# kubeadm init phase upload-certs
#
# Used when adding additional Control Plane nodes.
###############################################################################

control_plane_join_command_path: "{{ local_artifacts_dir }}/control-plane-join-command.sh"

###############################################################################
# Certificate Key
###############################################################################
# Shared certificate key required when joining
# additional Control Plane nodes.
###############################################################################

certificate_key_path: "{{ local_artifacts_dir }}/certificate-key.txt"

###############################################################################
# Helm Configuration
###############################################################################
# Helm is the package manager for Kubernetes.
#
# Ansible installs Helm on the Controller
# and uses it to deploy Kubernetes add-ons.
###############################################################################

###############################################################################
# Helm Version
###############################################################################

helm_version: "v3.17.3"

###############################################################################
# Helm Repositories
###############################################################################
# These repositories are added before any Helm chart
# is installed.
#
# Each repository contains one or more Kubernetes applications.
###############################################################################

helm_repositories:

  #############################################################################
  # NGINX Ingress Controller
  #############################################################################

  ingress_nginx:

    name: ingress-nginx

    url: https://kubernetes.github.io/ingress-nginx

  #############################################################################
  # Metrics Server
  #############################################################################

  metrics_server:

    name: metrics-server

    url: https://kubernetes-sigs.github.io/metrics-server/

  #############################################################################
  # Cert Manager
  #############################################################################

  cert_manager:

    name: jetstack

    url: https://charts.jetstack.io

  #############################################################################
  # AWS EBS CSI Driver
  #############################################################################

  aws_ebs_csi:

    name: aws-ebs-csi-driver

    url: https://kubernetes-sigs.github.io/aws-ebs-csi-driver

  #############################################################################
  # Cluster Autoscaler
  #############################################################################

  cluster_autoscaler:

    name: autoscaler

    url: https://kubernetes.github.io/autoscaler

  #############################################################################
  # Argo CD
  #############################################################################

  argocd:

    name: argo

    url: https://argoproj.github.io/argo-helm












    ###############################################################################
# Helm Releases
###############################################################################
# These are the Kubernetes applications installed by Helm
# after the cluster has been successfully bootstrapped.
#
# Each release defines:
#
#   • Helm Chart
#   • Chart Version
#   • Kubernetes Namespace
#   • Helm Release Name
#
###############################################################################

helm_charts:

  #############################################################################
  # NGINX Ingress Controller
  #############################################################################

  ingress_nginx:

    chart: ingress-nginx/ingress-nginx

    version: "4.13.1"

    namespace: ingress-nginx

    release: ingress-nginx

  #############################################################################
  # Metrics Server
  #############################################################################

  metrics_server:

    chart: metrics-server/metrics-server

    version: "3.13.0"

    namespace: kube-system

    release: metrics-server

  #############################################################################
  # cert-manager
  #############################################################################

  cert_manager:

    chart: jetstack/cert-manager

    version: "v1.18.2"

    namespace: cert-manager

    release: cert-manager

  #############################################################################
  # AWS EBS CSI Driver
  #############################################################################

  aws_ebs_csi:

    chart: aws-ebs-csi-driver/aws-ebs-csi-driver

    version: "2.41.0"

    namespace: kube-system

    release: aws-ebs-csi-driver

  #############################################################################
  # Cluster Autoscaler
  #############################################################################

  cluster_autoscaler:

    chart: autoscaler/cluster-autoscaler

    version: "9.46.6"

    namespace: kube-system

    release: cluster-autoscaler

  #############################################################################
  # Argo CD
  #############################################################################

  argocd:

    chart: argo/argo-cd

    version: "8.3.0"

    namespace: argocd

    release: argocd

###############################################################################
# Kubernetes Networking (Calico)
###############################################################################
# Calico is the Container Network Interface (CNI) used by the cluster.
#
# Responsibilities:
#
# • Pod-to-Pod Networking
# • Network Policies
# • Routing
#
# The manifest is downloaded directly from the official Calico repository.
###############################################################################

calico_version: "v3.30.3"

calico_manifest_url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml"

###############################################################################
# Cluster Bootstrap Validation
###############################################################################
# Maximum time (seconds) Ansible waits during cluster creation.
#
# These values are used with wait_for, retries and until loops.
###############################################################################

###############################################################################
# Wait for Kubernetes Nodes
###############################################################################

wait_for_node_ready_timeout: 600

###############################################################################
# Wait for Pods
###############################################################################

wait_for_pod_ready_timeout: 600

###############################################################################
# Wait for Kubernetes API Server
###############################################################################

wait_for_api_timeout: 600

###############################################################################
# Auto Scaling Configuration
###############################################################################
# Percentage of worker nodes processed simultaneously
# during rolling operations.
###############################################################################

worker_batch_percentage: 30

###############################################################################
# Kubernetes Client Configuration
###############################################################################
# Kubernetes modules and Helm use this kubeconfig file
# to authenticate with the cluster.
#
# This file is copied from the first Control Plane
# after kubeadm init completes.
###############################################################################

kubeconfig: "{{ admin_kubeconfig_path }}"