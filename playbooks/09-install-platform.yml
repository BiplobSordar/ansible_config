
- name: Install Kubernetes Platform Components
  hosts: bootstrap
  become: true
  gather_facts: true
  any_errors_fatal: true

  vars_files:
    - vars/defaults.yml
    - vars/terraform.yml
    - vars/kubernetes.yml
    - vars/containerd.yml
    - vars/calico.yml
    - vars/helm.yml
    - vars/validation.yml
    - vars/artifacts.yml

  pre_tasks:

    - name: Verify Kubernetes API access
      ansible.builtin.command:
        cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf get nodes
      register: kubectl_check
      changed_when: false

    - name: Fail if Kubernetes API is unavailable
      ansible.builtin.assert:
        that:
          - kubectl_check.rc == 0
        fail_msg: |
          Cannot access Kubernetes API.
          Cluster bootstrap must complete first.

  roles:

    - role: install_platform
      tags:
        - platform