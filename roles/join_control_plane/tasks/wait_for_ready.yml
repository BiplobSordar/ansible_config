###############################################################################
# Wait Kubernetes Node Ready
#
# After kubeadm join --control-plane:
#
# 1. Node registers with API server
# 2. Kubelet starts
# 3. Node becomes Ready
#
###############################################################################


###############################################################################
# Wait Node Registration
###############################################################################

- name: Wait for control-plane node registration

  ansible.builtin.command:

    cmd: >

      kubectl

      --kubeconfig={{ join_admin_conf_path }}

      get node {{ ansible_hostname }}


  register: node_registration


  changed_when: false


  retries: "{{ join_ready_wait_retries }}"

  delay: "{{ join_ready_wait_delay }}"


  until:

    - node_registration.rc == 0



###############################################################################
# Wait Node Ready Condition
###############################################################################

- name: Wait until control-plane node becomes Ready

  ansible.builtin.command:

    cmd: >

      kubectl

      --kubeconfig={{ join_admin_conf_path }}

      get node {{ ansible_hostname }}

      -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'


  register: node_ready


  changed_when: false


  retries: "{{ join_ready_wait_retries }}"

  delay: "{{ join_ready_wait_delay }}"


  until:

    - node_ready.stdout == "True"



###############################################################################
# Show Cluster Nodes
###############################################################################

- name: Display Kubernetes nodes

  ansible.builtin.command:

    cmd: >

      kubectl

      --kubeconfig={{ join_admin_conf_path }}

      get nodes -o wide


  register: cluster_nodes


  changed_when: false



###############################################################################
# Report
###############################################################################

- name: Report node readiness

  ansible.builtin.debug:

    var: cluster_nodes.stdout_lines