###############################################################################
# Join Kubernetes Worker Node
#
# Responsibilities:
#
# 1. Check if worker already joined
# 2. Validate kubeadm installation
# 3. Load worker join command
#      - Local artifact first
#      - AWS SSM fallback
# 4. Execute kubeadm join
# 5. Create worker join marker
# 6. Wait until worker becomes Ready
#
###############################################################################


###############################################################################
# Check Existing State
###############################################################################

- name: Check worker join marker

  ansible.builtin.stat:

    path: "{{ worker_join_marker_path }}"

  register: worker_join_marker



- name: Determine worker joined state

  ansible.builtin.set_fact:

    worker_already_joined: "{{ worker_join_marker.stat.exists }}"



###############################################################################
# Validate kubeadm
###############################################################################

- name: Check kubeadm installation

  ansible.builtin.command:

    cmd: kubeadm version

  changed_when: false



###############################################################################
# Get Local Worker Join Artifact
###############################################################################

- name: Check local worker join command artifact

  ansible.builtin.stat:

    path: "{{ worker_join_command_path }}"

  delegate_to: localhost

  become: false

  register: worker_join_file

  when: not worker_already_joined



- name: Load worker join command from local artifact

  ansible.builtin.set_fact:

    worker_join_cmd: >-
      {{
        lookup(
          'file',
          worker_join_command_path
        ) | trim
      }}

  when:

    - not worker_already_joined

    - worker_join_file.stat.exists | default(false)



###############################################################################
# AWS SSM FALLBACK
###############################################################################

- name: Load worker join command from AWS SSM

  ansible.builtin.set_fact:

    worker_join_cmd: >-
      {{
        lookup(
          'amazon.aws.ssm_parameter',
          worker_join_ssm_parameter,
          region=aws_region
        ) | trim
      }}

  when:

    - not worker_already_joined

    - worker_join_use_ssm_fallback

    - not (worker_join_file.stat.exists | default(false))



###############################################################################
# Validate Join Command
###############################################################################

- name: Verify worker join command exists

  ansible.builtin.assert:

    that:

      - worker_join_cmd is defined

      - worker_join_cmd | length > 0


    fail_msg:

      Worker kubeadm join command was not found.



###############################################################################
# Join Worker Node
###############################################################################

- name: Join Kubernetes worker node

  ansible.builtin.shell:

    cmd: "{{ worker_join_cmd }}"

    executable: /bin/bash


  register: kubeadm_worker_join_result


  when:

    - not worker_already_joined



###############################################################################
# Create Worker Marker
###############################################################################

- name: Create worker join marker

  ansible.builtin.copy:

    dest: "{{ worker_join_marker_path }}"

    content: |
      joined_at={{ ansible_date_time.iso8601 }}
      node={{ inventory_hostname }}

    owner: root

    group: root

    mode: "0600"


  when:

    - not worker_already_joined

    - kubeadm_worker_join_result.rc == 0



###############################################################################
# Wait Worker Ready
###############################################################################

- name: Wait worker node readiness

  ansible.builtin.include_tasks:

    file: wait_for_ready.yml



###############################################################################
# Report
###############################################################################

- name: Worker join complete

  ansible.builtin.debug:

    msg:

      - "Worker node joined successfully"

      - "Node: {{ inventory_hostname }}"