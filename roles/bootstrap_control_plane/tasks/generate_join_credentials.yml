---
###############################################################################
# Generate Kubernetes Join Credentials
#
# Responsibilities
#
# 1. Generate a fresh worker join command.
# 2. Upload control-plane certificates.
# 3. Generate a fresh certificate key.
# 4. Build the control-plane join command.
# 5. Save all artifacts on the bootstrap node.
# 6. Expose the values as Ansible facts.
#
# Safe to run multiple times.
###############################################################################

################################################################################
# Generate Worker Join Command
################################################################################

- name: Generate worker join command
  ansible.builtin.command:
    cmd: kubeadm token create --print-join-command

  register: worker_join_command

  changed_when: true

################################################################################
# Upload Control Plane Certificates
################################################################################

- name: Upload control-plane certificates
  ansible.builtin.command:
    cmd: kubeadm init phase upload-certs --upload-certs

  register: upload_certs

  changed_when: true

################################################################################
# Extract Certificate Key
################################################################################

- name: Extract certificate key
  ansible.builtin.set_fact:

    certificate_key: "{{ upload_certs.stdout_lines | last | trim }}"

################################################################################
# Build Control Plane Join Command
################################################################################

- name: Build control-plane join command
  ansible.builtin.set_fact:

    control_plane_join_command: >-
      {{ worker_join_command.stdout }}
      --control-plane
      --certificate-key
      {{ certificate_key }}

################################################################################
# Save Worker Join Script
################################################################################

- name: Save worker join script
  ansible.builtin.copy:

    dest: /etc/kubernetes/worker-join-command.sh

    content: |
      #!/usr/bin/env bash
      {{ worker_join_command.stdout }}

    owner: root
    group: root
    mode: "0700"

################################################################################
# Save Control Plane Join Script
################################################################################

- name: Save control-plane join script
  ansible.builtin.copy:

    dest: /etc/kubernetes/control-plane-join-command.sh

    content: |
      #!/usr/bin/env bash
      {{ control_plane_join_command }}

    owner: root
    group: root
    mode: "0700"

################################################################################
# Save Certificate Key
################################################################################

- name: Save certificate key

  ansible.builtin.copy:

    dest: /etc/kubernetes/certificate-key.txt

    content: |
      {{ certificate_key }}

    owner: root
    group: root
    mode: "0600"

################################################################################
# Expose Facts
################################################################################

- name: Expose join credentials

  ansible.builtin.set_fact:

    fact_worker_join_command: "{{ worker_join_command.stdout }}"

    fact_control_plane_join_command: "{{ control_plane_join_command }}"

    fact_certificate_key: "{{ certificate_key }}"