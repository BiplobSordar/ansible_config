---
###############################################################################
# Bootstrap Control Plane Defaults
###############################################################################

###############################################################################
# kubeadm
###############################################################################

bootstrap_kubeadm_config_path: /etc/kubernetes/kubeadm-init-config.yaml

bootstrap_admin_conf_path: /etc/kubernetes/admin.conf

bootstrap_marker_path: /etc/kubernetes/.ansible-bootstrap-complete

###############################################################################
# Join Artifact Paths (Remote)
###############################################################################

bootstrap_worker_join_command_path: /etc/kubernetes/worker-join-command.sh

bootstrap_control_plane_join_command_path: /etc/kubernetes/control-plane-join-command.sh

bootstrap_certificate_key_path: /etc/kubernetes/certificate-key.txt

###############################################################################
# API Wait
###############################################################################

bootstrap_api_wait_retries: 30

bootstrap_api_wait_delay: 10

###############################################################################
# kubeadm
###############################################################################

bootstrap_upload_certs: true