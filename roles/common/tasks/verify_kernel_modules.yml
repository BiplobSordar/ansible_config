---
# roles/common/tasks/verify_kernel_modules.yml

- name: Collect loaded kernel modules
  ansible.builtin.command: lsmod
  register: loaded_modules
  changed_when: false

- name: Assert required kernel modules loaded
  ansible.builtin.assert:
    that:
      - loaded_modules.stdout is regex("(?m)^{{ item }}\\s")
    fail_msg: "Kernel module {{ item }} is missing."
    success_msg: "{{ item }} loaded."
  loop: "{{ common_expected_kernel_modules }}"

- name: Verify module persistence
  ansible.builtin.command: cat /etc/modules-load.d/k8s.conf
  register: module_file
  changed_when: false
  failed_when: false

- name: Assert persistent module configuration
  ansible.builtin.assert:
    that:
      - item in module_file.stdout
    fail_msg: "{{ item }} missing from modules-load config."
    success_msg: "{{ item }} persistent."
  loop: "{{ common_expected_kernel_modules }}"