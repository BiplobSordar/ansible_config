---

- name: Check API server health

  ansible.builtin.command:


    cmd: >

      kubectl

      --kubeconfig={{ validation_admin_conf_path }}

      get --raw=/healthz


  register: api_health


  changed_when: false



- name: Assert API server healthy


  ansible.builtin.assert:


    that:

      - api_health.stdout == "ok"


    fail_msg:

      "API Server unhealthy"


    success_msg:

      "API Server healthy"