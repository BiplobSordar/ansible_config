---

- name: Load all cluster variables
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../vars/{{ item }}"
  loop:
    - defaults.yml
    - terraform.yml
    - kubernetes.yml
    - containerd.yml
    - calico.yml
    - helm.yml
    - validation.yml
    - artifacts.yml
    - control_plane.yml
    - workers.yml