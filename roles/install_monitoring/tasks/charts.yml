- name: Create monitoring namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ monitoring_namespace }}"
    state: present
    kubeconfig: "{{ monitoring_kubeconfig }}"

- name: Install kube-prometheus-stack
  kubernetes.core.helm:
    kubeconfig: "{{ monitoring_kubeconfig }}"
    name: "{{ prometheus_release_name }}"
    chart_ref: prometheus-community/kube-prometheus-stack
    chart_version: "{{ prometheus_stack_chart_version }}"
    release_namespace: "{{ monitoring_namespace }}"
    create_namespace: true
    values_files:
      - /etc/kubernetes/monitoring/prometheus.yaml
    wait: true
    timeout: 10m

- name: Install Loki
  kubernetes.core.helm:
    kubeconfig: "{{ monitoring_kubeconfig }}"
    name: "{{ loki_release_name }}"
    chart_ref: grafana/loki
    chart_version: "{{ loki_chart_version }}"
    release_namespace: "{{ monitoring_namespace }}"
    create_namespace: true
    values_files:
      - /etc/kubernetes/monitoring/loki.yaml
    wait: true
    timeout: 10m

- name: Install Promtail
  kubernetes.core.helm:
    kubeconfig: "{{ monitoring_kubeconfig }}"
    name: "{{ promtail_release_name }}"
    chart_ref: grafana/promtail
    chart_version: "{{ promtail_chart_version }}"
    release_namespace: "{{ monitoring_namespace }}"
    create_namespace: true
    values_files:
      - /etc/kubernetes/monitoring/promtail.yaml
    wait: true
    timeout: 10m