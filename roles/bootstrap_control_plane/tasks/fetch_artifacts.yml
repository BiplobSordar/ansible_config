---

- name: Ensure local artifacts directory exists
  ansible.builtin.file:
    path: "{{ local_artifacts_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Fetch admin.conf
  ansible.builtin.fetch:
    src: "{{ bootstrap_admin_conf_path }}"
    dest: "{{ local_admin_kubeconfig_path }}"
    flat: true

- name: Fetch worker join command
  ansible.builtin.fetch:
    src: "{{ bootstrap_worker_join_command_path }}"
    dest: "{{ worker_join_command_path }}"
    flat: true

- name: Fetch control-plane join command
  ansible.builtin.fetch:
    src: "{{ bootstrap_control_plane_join_command_path }}"
    dest: "{{ control_plane_join_command_path }}"
    flat: true

- name: Fetch certificate key
  ansible.builtin.fetch:
    src: "{{ bootstrap_certificate_key_path }}"
    dest: "{{ certificate_key_path }}"
    flat: true

- name: Secure local artifacts directory
  ansible.builtin.file:
    path: "{{ local_artifacts_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Report fetched artifacts
  ansible.builtin.debug:
    msg:
      - "Artifacts downloaded successfully."
      - "admin.conf"
      - "worker-join-command.sh"
      - "control-plane-join-command.sh"
      - "certificate-key.txt"