###############################################################################
# Worker Join Defaults
###############################################################################


###############################################################################
# Join State
###############################################################################

worker_join_marker_path: /etc/kubernetes/.ansible-worker-join-complete



###############################################################################
# Local Artifact
###############################################################################

worker_join_command_path: "{{ local_artifacts_dir }}/worker-join-command.sh"



###############################################################################
# AWS SSM
#
# Terraform creates this parameter.
#
# Bootstrap updates this value.
#
# Contains:
#
# kubeadm join <control-plane-endpoint>:6443
# --token xxxx
# --discovery-token-ca-cert-hash sha256:xxxx
#
###############################################################################

worker_join_ssm_parameter: ""



###############################################################################
# Join Source
###############################################################################

worker_join_use_ssm_fallback: true



###############################################################################
# Readiness
###############################################################################

worker_ready_wait_retries: 30

worker_ready_wait_delay: 10



###############################################################################
# Kubernetes Admin Config
#
# Used from existing control-plane node
#
###############################################################################

worker_admin_conf_path_on_control_plane: /etc/kubernetes/admin.conf