###############################################################################
# Join Additional Control Plane Defaults
###############################################################################

###############################################################################
# Join State
###############################################################################

join_marker_path: /etc/kubernetes/.ansible-control-plane-join-complete

join_admin_conf_path: /etc/kubernetes/admin.conf


###############################################################################
# Local Artifact
###############################################################################

control_plane_join_command_path: "{{ local_artifacts_dir }}/control-plane-join-command.sh"


###############################################################################
# AWS SSM
#
# Terraform creates this parameter.
#
# Bootstrap updates the value.
#
# Contains full kubeadm join command:
#
# kubeadm join <endpoint>:6443 \
#   --token xxxx \
#   --discovery-token-ca-cert-hash sha256:xxxx \
#   --control-plane \
#   --certificate-key xxxx
#
###############################################################################

kubeadm_control_plane_join_parameter: ""


###############################################################################
# Join Source
###############################################################################

join_use_ssm_fallback: true


###############################################################################
# Kubernetes Ready Wait
###############################################################################

join_ready_wait_retries: 30

join_ready_wait_delay: 10


###############################################################################
# Etcd Validation
###############################################################################

join_etcd_wait_retries: 18

join_etcd_wait_delay: 10