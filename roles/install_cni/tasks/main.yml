- name: Verify admin kubeconfig exists
  ansible.builtin.stat:
    path: "{{ admin_kubeconfig_path }}"
  register: admin_conf

- name: Fail if admin kubeconfig is missing
  ansible.builtin.assert:
    that:
      - admin_conf.stat.exists
      - admin_conf.stat.isreg
      - admin_conf.stat.size | int > 0
    fail_msg: >-
      {{ admin_kubeconfig_path }} not found or empty.
      kubeadm init has probably not completed successfully.

- name: Wait until Kubernetes API server is reachable
  ansible.builtin.command:
    cmd: >-
      kubectl
      --kubeconfig={{ admin_kubeconfig_path }}
      cluster-info
  register: api_server
  changed_when: false
  retries: "{{ cni_api_wait_retries }}"
  delay: "{{ cni_api_wait_delay }}"
  until: api_server.rc == 0

- name: Download Calico manifest
  ansible.builtin.get_url:
    url: "{{ calico_manifest_url }}"
    dest: "{{ cni_manifest_dest }}"
    mode: "0644"
    force: true

- name: Verify Calico manifest exists
  ansible.builtin.stat:
    path: "{{ cni_manifest_dest }}"
  register: calico_manifest

- name: Fail if Calico manifest is missing
  ansible.builtin.assert:
    that:
      - calico_manifest.stat.exists
      - calico_manifest.stat.isreg
      - calico_manifest.stat.size | int > 0
    fail_msg: >-
      Calico manifest was not downloaded correctly:
      {{ cni_manifest_dest }}

- name: Apply Calico manifest
  ansible.builtin.command:
    cmd: >-
      kubectl
      --kubeconfig={{ admin_kubeconfig_path }}
      apply
      -f
      {{ cni_manifest_dest }}
  register: calico_apply
  changed_when: >
    'created' in calico_apply.stdout or
    'configured' in calico_apply.stdout

- name: Wait for Calico DaemonSet to be created
  ansible.builtin.command:
    cmd: >-
      kubectl
      --kubeconfig={{ admin_kubeconfig_path }}
      get daemonset calico-node
      -n kube-system
  register: calico_daemonset
  changed_when: false
  retries: "{{ cni_daemonset_wait_retries }}"
  delay: "{{ cni_daemonset_wait_delay }}"
  until: calico_daemonset.rc == 0

- name: Wait until Calico DaemonSet rollout completes
  ansible.builtin.command:
    cmd: >-
      kubectl
      --kubeconfig={{ admin_kubeconfig_path }}
      rollout status
      daemonset/calico-node
      -n kube-system
      --timeout=300s
  register: calico_rollout
  changed_when: false

- name: Show Calico pods
  ansible.builtin.command:
    cmd: >-
      kubectl
      --kubeconfig={{ admin_kubeconfig_path }}
      get pods
      -n kube-system
      -l k8s-app=calico-node
      -o wide
  register: calico_pods
  changed_when: false

- name: Display Calico pods
  ansible.builtin.debug:
    var: calico_pods.stdout_lines

