---
###############################################################################
# Wait for Kubernetes API Server
#
# This task waits until the bootstrap control-plane is fully operational.
#
# Responsibilities
#
# 1. Wait for API Server health endpoint.
# 2. Wait for bootstrap node registration.
# 3. Wait until bootstrap node becomes Ready.
# 4. Display cluster status.
#
###############################################################################

################################################################################
# Wait for API Server Health
################################################################################

- name: Wait for Kubernetes API server
  ansible.builtin.command:
    cmd: >
      kubectl
      --kubeconfig={{ bootstrap_admin_conf_path }}
      get --raw=/healthz
  register: api_health
  changed_when: false
  retries: "{{ bootstrap_api_wait_retries }}"
  delay: "{{ bootstrap_api_wait_delay }}"
  until:
    - api_health.rc == 0
    - api_health.stdout | trim == "ok"

################################################################################
# Wait for Bootstrap Node Registration
################################################################################

- name: Wait until bootstrap node is registered
  ansible.builtin.command:
    cmd: >
      kubectl
      --kubeconfig={{ bootstrap_admin_conf_path }}
      get node {{ ansible_hostname }}
  register: bootstrap_node
  changed_when: false
  retries: "{{ bootstrap_api_wait_retries }}"
  delay: "{{ bootstrap_api_wait_delay }}"
  until: bootstrap_node.rc == 0

################################################################################
# Wait for Bootstrap Node Ready
################################################################################

- name: Wait until bootstrap node becomes Ready
  ansible.builtin.command:
    cmd: >
      kubectl
      --kubeconfig={{ bootstrap_admin_conf_path }}
      get node {{ ansible_hostname }}
      -o jsonpath={.status.conditions[?(@.type=="Ready")].status}
  register: bootstrap_ready
  changed_when: false
  retries: "{{ bootstrap_api_wait_retries }}"
  delay: "{{ bootstrap_api_wait_delay }}"
  until:
    - bootstrap_ready.rc == 0
    - bootstrap_ready.stdout == "True"

################################################################################
# Display Cluster Nodes
################################################################################

- name: Display cluster nodes
  ansible.builtin.command:
    cmd: >
      kubectl
      --kubeconfig={{ bootstrap_admin_conf_path }}
      get nodes -o wide
  register: cluster_nodes
  changed_when: false

################################################################################
# Display System Pods
################################################################################

- name: Display kube-system pods
  ansible.builtin.command:
    cmd: >
      kubectl
      --kubeconfig={{ bootstrap_admin_conf_path }}
      get pods -n kube-system
  register: system_pods
  changed_when: false

################################################################################
# Report Cluster Status
################################################################################

- name: Report bootstrap status
  ansible.builtin.debug:
    msg:
      - "Bootstrap control-plane is Ready."
      - ""
      - "Cluster Nodes:"
      - "{{ cluster_nodes.stdout_lines }}"
      - ""
      - "Kube-System Pods:"
      - "{{ system_pods.stdout_lines }}"