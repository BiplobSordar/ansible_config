---
###############################################################################
# Generate Kubernetes Join Credentials
#
# Responsibilities
#
# 1. Generate a worker join command.
# 2. Upload control-plane certificates.
# 3. Extract the certificate key.
# 4. Build the complete control-plane join command.
# 5. Save join scripts on the bootstrap node.
# 6. Save certificate key (optional/debugging).
# 7. Expose values as Ansible facts.
###############################################################################

################################################################################
# Generate Worker Join Command
################################################################################

- name: Generate worker join command
  ansible.builtin.command:
    cmd: kubeadm token create --print-join-command
  register: worker_join_command
  changed_when: true

################################################################################
# Upload Control Plane Certificates
################################################################################

- name: Upload control-plane certificates
  ansible.builtin.command:
    cmd: kubeadm init phase upload-certs --upload-certs
  register: upload_certs
  changed_when: true

################################################################################
# Extract Certificate Key
################################################################################

- name: Extract certificate key
  ansible.builtin.set_fact:
    certificate_key: "{{ upload_certs.stdout_lines | last | trim }}"

################################################################################
# Build Control Plane Join Command
################################################################################

- name: Build control-plane join command
  ansible.builtin.set_fact:
    control_plane_join_command: >-
      {{ worker_join_command.stdout }}
      --control-plane
      --certificate-key
      {{ certificate_key }}

################################################################################
# Save Worker Join Script
################################################################################

- name: Save worker join command
  ansible.builtin.copy:
    dest: "{{ bootstrap_worker_join_command_path }}"
    content: |
      #!/usr/bin/env bash
      {{ worker_join_command.stdout }}
    owner: root
    group: root
    mode: "0700"

################################################################################
# Save Control Plane Join Script
################################################################################

- name: Save control-plane join command
  ansible.builtin.copy:
    dest: "{{ bootstrap_control_plane_join_command_path }}"
    content: |
      #!/usr/bin/env bash
      {{ control_plane_join_command }}
    owner: root
    group: root
    mode: "0700"

################################################################################
# Save Certificate Key
################################################################################

- name: Save certificate key
  ansible.builtin.copy:
    dest: "{{ bootstrap_certificate_key_path }}"
    content: |
      {{ certificate_key }}
    owner: root
    group: root
    mode: "0600"

################################################################################
# Export Ansible Facts
################################################################################

- name: Export join credentials
  ansible.builtin.set_fact:
    fact_worker_join_command: "{{ worker_join_command.stdout }}"
    fact_control_plane_join_command: "{{ control_plane_join_command }}"
    fact_certificate_key: "{{ certificate_key }}"

################################################################################
# Report
################################################################################

- name: Display generated join credentials
  ansible.builtin.debug:
    msg:
      - "Worker join command generated."
      - "Control-plane join command generated."
      - "Certificate key generated."